<!DOCTYPE html>
<html>
<head>
    <title>Manage Movies</title>
    <style>

    body {
        font-family: Arial, sans-serif;
        background: #f2f2f2;
        margin: 0;
        padding: 30px;
    }

    h1 {
        text-align: center;
    }

    #movieList {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
    }

    .movie-card {
        background: white;
        border-radius: 10px;
        padding: 15px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
    }

    .movie-card img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        border-radius: 8px;
    }

    .movie-card h3 {
        margin-bottom: 15px;
    }

    button {
        padding: 8px 15px;
        margin-right: 8px;
        cursor: pointer;
    }

    #editForm {
        background: white;
        padding: 25px;
        border-radius: 10px;
        max-width: 600px;
        margin: auto;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
    }

    #editForm input,
    #editForm textarea {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
    }

</style>
</head>

<body>

    <h1>Manage Movies</h1>

    <div id="movieList"></div>
    <hr>

<div id="editForm" style="display: none;">
    <h2>Edit Movie</h2>
    <input type="hidden" id="editId">

<input type="text" id="editName" placeholder="Movie Name">
<br><br>

<input type="text" id="editDirector" placeholder="Director">
<br><br>

<input type="text" id="editGenre" placeholder="Genre">
<br><br>

<input type="number" id="editRating" placeholder="Rating" step="0.1">
<br><br>

<textarea id="editDescription" placeholder="Description"></textarea>
<br><br>

<input type="url" id="editMovieLink" placeholder="Movie URL">
<br><br>

<input type="url" id="editPoster" placeholder="Poster Image URL">
<br><br>

<button onclick="updateMovie()">Update Movie</button>

<button onclick="cancelEdit()">Cancel</button>
</div>

    <script>

        function loadMovies() {

            fetch("/movies")
                .then(response => response.json())
                .then(movies => {

                    const movieList = document.getElementById("movieList");

                    movieList.innerHTML = "";

                    movies.forEach(movie => {

                    	movieList.innerHTML += `
                    	    <div class="movie-card">

                    	        <img src="${movie.poster}" alt="${movie.name}">

                    	        <h3>${movie.name}</h3>

                    	        <p><strong>Genre:</strong> ${movie.genre}</p>

                    	        <p><strong>Rating:</strong> ⭐ ${movie.rating}/10</p>

                    	        <button onclick="editMovie(${movie.id})">
                    	            Edit
                    	        </button>

                    	        <button onclick="deleteMovie(${movie.id})">
                    	            Delete
                    	        </button>

                    	    </div>
                    	`;

                    });

                });

        }

        function deleteMovie(id) {

            if (!confirm("Are you sure you want to delete this movie?")) {
                return;
            }

            fetch("/movies/" + id, {
                method: "DELETE"
            })
            .then(response => {

                if (response.ok) {

                    alert("Movie deleted successfully!");

                    loadMovies();

                } else {

                    alert("Failed to delete movie.");

                }

            });

        }
        function editMovie(id) {

            fetch("/movies")
                .then(response => response.json())
                .then(movies => {

                    const movie = movies.find(m => m.id === id);

                    document.getElementById("editId").value = movie.id;
                    document.getElementById("editName").value = movie.name;
                    document.getElementById("editDirector").value = movie.director;
                    document.getElementById("editGenre").value = movie.genre;
                    document.getElementById("editRating").value = movie.rating;
                    document.getElementById("editDescription").value = movie.description;
                    document.getElementById("editMovieLink").value = movie.movieLink;
                    document.getElementById("editPoster").value = movie.poster;

                    document.getElementById("editForm").style.display = "block";

                });
        }
        
        function updateMovie() {

            const id = document.getElementById("editId").value;

            const formData = new URLSearchParams();

            formData.append("name", document.getElementById("editName").value);
            formData.append("director", document.getElementById("editDirector").value);
            formData.append("genre", document.getElementById("editGenre").value);
            formData.append("rating", document.getElementById("editRating").value);
            formData.append("description", document.getElementById("editDescription").value);
            formData.append("movieLink", document.getElementById("editMovieLink").value);
            formData.append("poster", document.getElementById("editPoster").value);

            fetch("/movies/" + id, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: formData
            })
            .then(response => {

                if (response.ok) {

                    alert("Movie updated successfully!");

                    document.getElementById("editForm").style.display = "none";

                    loadMovies();

                } else {

                    alert("Failed to update movie.");

                }

            });
        }
        
        function cancelEdit() {

            document.getElementById("editForm").style.display = "none";

        }
        
        loadMovies();

    </script>

</body>
</html>
