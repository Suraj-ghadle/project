<!DOCTYPE html>
<html>

<head>
    <title>Admin - Add Movie</title>
</head>

<body>

    <h1>Admin Panel</h1>

    <h2>Add Movie</h2>

    <input type="text" id="name" placeholder="Movie Name" required>
    <br><br>

    <input type="text" id="director" placeholder="Director" required>
    <br><br>

    <input type="text" id="genre" placeholder="Genre" required>
    <br><br>

<input type="number" id="rating" placeholder="Rating" step="0.1" min="0" max="5" required>    <br><br>

    <textarea id="description" placeholder="Description" required></textarea>
    <br><br>

    <input type="url" id="movieLink" placeholder="Movie URL" required>
    <br><br>

    <label>Movie Poster URL:</label>
<input type="url" id="poster" placeholder="Paste image URL"required>
    <br><br>

    <button onclick="addMovie()">Add Movie</button>
     
     <br><br>
<button onclick="window.open('manage-movies.html', '_blank')">
    Manage Movies
</button>

    <script>

        function addMovie() {
        	const name = document.getElementById("name").value.trim();
        	const director = document.getElementById("director").value.trim();
        	const genre = document.getElementById("genre").value.trim();
        	const rating = document.getElementById("rating").value;
        	const description = document.getElementById("description").value.trim();
        	const movieLink = document.getElementById("movieLink").value.trim();
        	const poster = document.getElementById("poster").value.trim();

        	if (!name || !director || !genre || !rating || !description || !movieLink || !poster) {
        	    alert("Please fill all fields.");
        	    return;
        	}

        	if (rating < 0 || rating > 10) {
        	    alert("Rating must be between 0 and 5.");
        	    return;
        	}

            const formData = new FormData();

            formData.append("name", document.getElementById("name").value);
            formData.append("director", document.getElementById("director").value);
            formData.append("genre", document.getElementById("genre").value);
            formData.append("rating", document.getElementById("rating").value);
            formData.append("description", document.getElementById("description").value);
            formData.append("movieLink", document.getElementById("movieLink").value);
            formData.append("poster", document.getElementById("poster").value);
            fetch('/movies', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                alert("Movie added successfully!");
                location.reload();
            })
            .catch(error => {
                console.error("Error:", error);
                alert("Failed to add movie.");
            });
        }

    </script>

</body>

</html>
