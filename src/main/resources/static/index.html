<!DOCTYPE html>
<html>

<head>
    <title>Movie List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

      .filters {
    max-width: 900px;
    margin: 0 auto 35px auto;
    display: flex;
    gap: 15px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
}

.filters input,
.filters select {
    padding: 13px 18px;
    font-size: 16px;
    border: 1px solid #d0d0d0;
    border-radius: 25px;
    background: white;
    outline: none;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    transition: 0.2s;
}

#searchBox {
    width: 320px;
}

#genreFilter {
    width: 210px;
}

.filters input:focus,
.filters select:focus {
    border-color: #4b1f6f;
    box-shadow: 0 0 8px rgba(75, 31, 111, 0.25);
}

        #movieList {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: auto;
        }
.movie-card {
    background: white;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 5px 18px rgba(0, 0, 0, 0.12);
    transition: transform 0.25s, box-shadow 0.25s;
}

.movie-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.20);
}

.movie-poster {
    width: 100%;
    height: 380px;
    object-fit: cover;
    display: block;
    transition: transform 0.3s;
}

.movie-card:hover .movie-poster {
    transform: scale(1.03);
}

.movie-info {
    padding: 20px;
}

.movie-name {
    text-decoration: none;
    color: #222;
    font-size: 22px;
    font-weight: bold;
}

.movie-name:hover {
    color: #4b1f6f;
}

.genre {
    display: inline-block;
    background: #eee7f5;
    color: #4b1f6f;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 10px;
}

.rating {
    font-weight: bold;
    font-size: 16px;
}

.description {
    color: #555;
    line-height: 1.6;
    font-size: 14px;
}

  .movie-name:hover {
            color: #0066cc;
        }
        .no-movies {
            text-align: center;
            font-size: 20px;
            color: #666;
            grid-column: 1 / -1;
        }
        
       .navbar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    background: linear-gradient(135deg, #1b1b3a, #4b1f6f);
    padding: 22px 30px;
    margin: -30px -30px 30px -30px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
}

.logo {
    grid-column: 2;
    color: white;
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.35);
    text-align: center;
}

.logo-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    margin-right: 8px;
    border-radius: 50%;
    background: white;
    color: #4b1f6f;
    font-size: 16px;
}
.nav-left {
    grid-column: 1;
}

.nav-left a {
    color: white;
    text-decoration: none;
    font-size: 17px;
    font-weight: bold;
}

.nav-left a:hover {
    text-decoration: underline;
}

.nav-right {
    grid-column: 3;
}

#pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin: 35px 0 10px;
    flex-wrap: wrap;
}

#pagination button {
    padding: 9px 14px;
    border: none;
    border-radius: 8px;
    background: white;
    color: #4b1f6f;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.10);
}

#pagination button:hover:not(:disabled) {
    background: #eee7f5;
}

#pagination button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#pagination .active-page {
    background: #4b1f6f;
    color: white;
}
    </style>
</head>

<body>

  

    <nav class="navbar">

    <div class="nav-left">
        <a href="index.html">Home</a>
    </div>
<div class="logo">
    <span class="logo-icon">▶</span> SurajCinema
</div>

    <div class="nav-right">
    </div>

</nav>

    <h1>Movie List</h1>

    <!-- Search and Genre Filter -->
    <div class="filters">

        <input
            type="text"
            id="searchBox"
            placeholder="Search movies..."
        >

        <select id="genreFilter">
            <option value="">All Genres</option>
        </select>

    </div>

    <div id="movieList"></div>
    <div id="pagination"></div>

    <script>
    let allMovies = [];
    let currentPage = 1;
    const moviesPerPage = 8;
    let filteredMovies = [];

        // Load all movies
        fetch("/movies")
            .then(response => response.json())
            .then(movies => {

                allMovies = movies;

                loadGenres();

                displayMovies(allMovies);

            })
            .catch(error => {

                console.error("Error:", error);

            });


        // Create Genre dropdown
        function loadGenres() {

            const genreFilter = document.getElementById("genreFilter");

            const genres = [...new Set(
                allMovies.map(movie => movie.genre)
            )];

            genres.sort();

            genres.forEach(genre => {

                const option = document.createElement("option");

                option.value = genre;
                option.textContent = genre;

                genreFilter.appendChild(option);

            });
        }


        // Display movies
   function displayMovies(movies) {

    const movieList = document.getElementById("movieList");

    movieList.innerHTML = "";

    filteredMovies = movies;

    if (movies.length === 0) {

        movieList.innerHTML =
            '<p class="no-movies">No movies found.</p>';

        document.getElementById("pagination").innerHTML = "";

        return;
    }

    const startIndex = (currentPage - 1) * moviesPerPage;
    const endIndex = startIndex + moviesPerPage;

    const moviesToShow = movies.slice(startIndex, endIndex);

    moviesToShow.forEach(movie => {

        const card = document.createElement("div");

        card.className = "movie-card";

        let posterHTML = "";

        if (movie.poster) {

            posterHTML = `
                <a href="${movie.movieLink}" target="_blank">

                    <img
                        src="${movie.poster}"
                        class="movie-poster"
                        alt="${movie.name}"
                    >

                </a>
            `;
        }

        card.innerHTML = `

            ${posterHTML}

            <div class="movie-info">

                <h2>
                    <a
                        href="${movie.movieLink}"
                        target="_blank"
                        class="movie-name"
                    >
                        ${movie.name}
                    </a>
                </h2>

                <span class="genre">
                    ${movie.genre}
                </span>

                <p>
                    <strong>Director:</strong>
                    ${movie.director}
                </p>

                <p class="rating">
                    ⭐ Rating: ${movie.rating}/5
                </p>

                <p class="description">
                    ${movie.description}
                </p>

            </div>
        `;

        movieList.appendChild(card);

    });

    createPagination();
}

   function createPagination() {

	    const pagination = document.getElementById("pagination");

	    pagination.innerHTML = "";

	    const totalPages = Math.ceil(
	        filteredMovies.length / moviesPerPage
	    );

	    if (totalPages <= 1) {
	        return;
	    }

	    const previousButton = document.createElement("button");

	    previousButton.textContent = "Previous";

	    previousButton.disabled = currentPage === 1;

	    previousButton.onclick = function () {

	        if (currentPage > 1) {

	            currentPage--;

	            displayMovies(filteredMovies);

	        }

	    };

	    pagination.appendChild(previousButton);


	    for (let i = 1; i <= totalPages; i++) {

	        const pageButton = document.createElement("button");

	        pageButton.textContent = i;

	        if (i === currentPage) {
	            pageButton.classList.add("active-page");
	        }

	        pageButton.onclick = function () {

	            currentPage = i;

	            displayMovies(filteredMovies);

	        };

	        pagination.appendChild(pageButton);
	    }


	    const nextButton = document.createElement("button");

	    nextButton.textContent = "Next";

	    nextButton.disabled = currentPage === totalPages;

	    nextButton.onclick = function () {

	        if (currentPage < totalPages) {

	            currentPage++;

	            displayMovies(filteredMovies);

	        }

	    };

	    pagination.appendChild(nextButton);
	}

        // Search + Genre Filter
        function filterMovies() {

            const searchText =
                document.getElementById("searchBox").value
                .toLowerCase()
                .trim();

            const selectedGenre =
                document.getElementById("genreFilter").value;

            const filteredMovies = allMovies.filter(movie => {

                const matchesName =
                    movie.name
                    .toLowerCase()
                    .includes(searchText);

                const matchesGenre =
                    selectedGenre === ""
                    || movie.genre === selectedGenre;

                return matchesName && matchesGenre;

            });

            currentPage = 1;
            displayMovies(filteredMovies);

        }


        // Search when typing
        document
            .getElementById("searchBox")
            .addEventListener("input", filterMovies);


        // Filter when genre changes
        document
            .getElementById("genreFilter")
            .addEventListener("change", filterMovies);

    </script>

</body>

</html>
